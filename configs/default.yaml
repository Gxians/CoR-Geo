paths:
  project_root: .
  data_root: data
  output_root: outputs
  dinov2_root: third_party/dinov2
  datasets:
    cvact: data/CVACT
    cvusa: data/CVUSA
  checkpoints:
    dinov2_vitb14: checkpoints/dinov2/dinov2_vitb14_pretrain.pth
model:
  name: cor_geo
  backbone:
    name: dinov2_vitb14
    patch_size: 14
    output_dim: 768
    strict_checkpoint: true
    expected_transformer_blocks: 12
    finetuning:
      enabled: true
      update_start_epoch: 9
      trainable_blocks:
      - 8
      - 9
      - 10
      - 11
      block_update_start_epochs:
        8: 9
        9: 9
        10: 9
        11: 9
      train_final_norm: true
      final_norm_update_start_epoch: 9
      frozen_prefix_blocks:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      train_patch_embed: false
      train_non_block_tokens: false
      stage_a_forward_no_grad: true
      frozen_prefix_eval_mode: true
      active_blocks_train_mode: true
  input:
    ground_height: 224
    panorama_width: 756
    crop_widths:
      360: 756
      180: 378
      90: 189
      70: 147
    widths:
      360: 756
      180: 378
      90: 196
      70: 154
    satellite_size:
    - 378
    - 378
  architecture:
    name: column_ray_content_order
    angular_bins: 36
    angular_step_deg: 10.0
    direction_dim: 256
    ground_angular_resampling:
      name: conservative_interval_overlap
      applied_after_backbone: true
      source_patch_columns:
        360: 54
        180: 27
        90: 14
        70: 11
      target_direction_bins:
        360: 36
        180: 18
        90: 9
        70: 7
    content_order_encoder:
      input_dim: 768
      hidden_dim: 256
      content_dim: 128
      order_dim: 128
      joint_order_weight: 0.2
      ground_sequence_length: 16
      satellite_sequence_length: 16
      attention_queries: 1
      attention_scaling: inverse_sqrt_hidden_dim
      order_pooling: normalized_first_cosine_moment
      joint_composition: weighted_normalized_subspace_concat
      shared_across_modalities: true
      ground_sequence_order: bottom_to_top
      satellite_sampling: dense_center_to_square_boundary_midpoint_bilinear_assignment
  score:
    name: fov_masked_cyclic_hard_max
    shift_reduction: hard_max
  loss:
    info_nce_temperature: 0.07
    label_smoothing: 0.1
    symmetric: true
    order_retrieval_weight: 0.15
train:
  seed: 42
  epochs: 64
  progress_every_steps: 100
  distributed:
    enabled: true
    backend: nccl
    world_size: auto
    per_gpu_batch_size: auto
    global_batch_size: 64
    find_unused_parameters: true
    timeout_minutes: 1440
  dataloader:
    num_workers_per_rank: 12
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    drop_last: true
  dataset_cache:
    enabled: true
    required_splits:
    - train
    - val
    format: cor_geo_paired_resized_rgb_uint8_memmap_v1
    root: .cache/cor_geo/{dataset}/h224_w756_s378_v1
  mixed_fov_batch:
    fovs:
    - 360
    - 180
    - 90
    - 70
    samples_per_fov_per_global_batch: 16
    samples_per_fov_per_rank: auto
    one_ground_image_per_location: true
  optimizer:
    name: adamw
    weight_decay: 0.01
    zero_weight_decay_for_bias_and_norm: true
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    param_groups:
      content_order_encoder:
        base_learning_rate: 0.0002
        min_learning_rate: 2.0e-06
        active_from_epoch: 1
      dinov2_block_11:
        base_learning_rate: 1.0e-05
        min_learning_rate: 1.0e-06
        active_from_epoch: 9
      dinov2_block_10:
        base_learning_rate: 5.0e-06
        min_learning_rate: 5.0e-07
        active_from_epoch: 9
      dinov2_block_9:
        base_learning_rate: 2.5e-06
        min_learning_rate: 2.5e-07
        active_from_epoch: 9
      dinov2_block_8:
        base_learning_rate: 1.25e-06
        min_learning_rate: 1.25e-07
        active_from_epoch: 9
      dinov2_final_norm:
        base_learning_rate: 1.0e-05
        min_learning_rate: 1.0e-06
        active_from_epoch: 9
  scheduler:
    name: cosine_per_group
    step_unit: optimizer_step
    content_order_encoder:
      warmup_optimizer_steps: 125
      cosine_end_global_step: 26640
    dinov2:
      update_start_epoch: 9
      warmup_optimizer_steps_after_activation: 250
      active_optimizer_steps: 22200
      cosine_end_global_step: 26640
    late_cosine_overrides:
    - name: epoch49_to56_low_lr_restart
      epoch_start: 49
      epoch_end: 56
      groups:
        content_order_encoder:
          start_lr: 2.0e-05
          end_lr: 2.0e-06
        dinov2_block_11:
          start_lr: 2.0e-06
          end_lr: 1.0e-06
        dinov2_block_10:
          start_lr: 1.0e-06
          end_lr: 5.0e-07
        dinov2_block_9:
          start_lr: 5.0e-07
          end_lr: 2.5e-07
        dinov2_block_8:
          start_lr: 2.5e-07
          end_lr: 1.25e-07
        dinov2_final_norm:
          start_lr: 2.0e-06
          end_lr: 1.0e-06
    - name: conservative_epoch57_to64_refinement
      epoch_start: 57
      epoch_end: 64
      groups:
        content_order_encoder:
          start_lr: 1.0e-05
          end_lr: 1.0e-06
        dinov2_block_11:
          start_lr: 1.0e-06
          end_lr: 5.0e-07
        dinov2_block_10:
          start_lr: 5.0e-07
          end_lr: 2.5e-07
        dinov2_block_9:
          start_lr: 2.5e-07
          end_lr: 1.25e-07
        dinov2_block_8:
          start_lr: 1.25e-07
          end_lr: 6.25e-08
        dinov2_final_norm:
          start_lr: 1.0e-06
          end_lr: 5.0e-07
  precision:
    train_amp_dtype: bfloat16
  gradient:
    normal_batch_clip_norm: 16.0
    hard_batch_clip_norm: 24.0
    accumulation_steps: 1
  stages:
  - name: stage_a_balanced_all_fovs_frozen
    epoch_start: 1
    epoch_end: 8
    backbone_update: none
    steps_per_epoch: 555
    hard_batch_fraction: 0.0
  - name: stage_b_balanced_last_four_warmup
    epoch_start: 9
    epoch_end: 16
    backbone_update: blocks_8_9_10_11_and_final_norm
    steps_per_epoch: 555
    hard_batch_fraction: 0.0
  - name: stage_c_balanced_top64_hard_25pct
    epoch_start: 17
    epoch_end: 48
    backbone_update: blocks_8_9_10_11_and_final_norm
    steps_per_epoch: 555
    hard_batch_fraction: 0.25
  - name: stage_d_low_lr_restart_hard_25pct
    epoch_start: 49
    epoch_end: 56
    backbone_update: blocks_8_9_10_11_and_final_norm
    steps_per_epoch: 555
    hard_batch_fraction: 0.25
  - name: stage_e_conservative_final_refinement_hard_25pct
    epoch_start: 57
    epoch_end: 64
    backbone_update: blocks_8_9_10_11_and_final_norm
    steps_per_epoch: 555
    hard_batch_fraction: 0.25
  hard_mining:
    enabled: true
    pool_source: current_cor_geo_model
    refresh_after_epochs:
    - 16
    - 24
    - 32
    - 40
    - 48
    - 56
    mining_fovs:
    - 360
    - 180
    - 90
    - 70
    descriptor_export_batch_size_per_gpu: 32
    descriptor_export_workers_per_rank: 12
    coarse_frequency_count: 3
    coarse_candidate_locations: 512
    coarse_query_chunk_size: 512
    rerank_query_chunk_size: 32
    keep_negative_locations: 64
    sampling_strategy: anchor_plus_uniform_top64
    hard_neighbors_per_anchor: 15
    sampling_rank_range:
    - 1
    - 64
    anchor_selection: globally_unique_shuffle_no_pool_exclusion
    candidate_strategy: signed_dc_low2_fft_magnitude_top512_exact_cyclic_hardmax_top64_v1
    crop_orientation_contract: source_epoch_pool_equals_hard_batch
    storage_format: dense_ranked_location_indices_v1
  checkpoint:
    save_last: true
    save_full_epochs: true
    retained_epochs:
    - 8
    - 16
    - 24
    - 32
    - 40
    - 48
    - 56
    - 64
    resume_boundary: epoch_end
evaluation:
  report_split: val
  main_fovs:
  - 360
  - 180
  - 90
  - 70
  auxiliary_fovs: []
  during_training:
    enabled: true
    interval_epochs: 8
    selection_metric: macro_r1
  exact:
    encode_dtype: float32
    descriptor_storage_dtype: float32
    score_dtype: float32
    allow_tf32: false
  metrics:
    recall_ks:
    - 1
    - 5
    - 10
    r1_percent_rounding: floor
runtime:
  distributed:
    backend: nccl
    world_size: auto
    timeout_minutes: 1440
  descriptor_export:
    batch_size_per_gpu: 32
    workers_per_rank: 12
    progress_every_batches: 100
  exact_score:
    query_chunk_size: 128
    location_chunk_size: 2048
  storage:
    descriptor_dtype: float32
    prediction_shards: parquet
    staging_directory: .evaluation_staging
