[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cor-geo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.2",
  "pyarrow>=17",
  "Pillow>=10",
  "PyYAML>=6",
  "scipy>=1.13",
  "torch==2.3.1",
  "torchvision==0.18.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
